[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-modality-weak-supervision"
version = "0.1.0"
description = "Cross-Modality Weakly Supervised 3D Tumor Localization via Autonomous Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Research Team" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-image>=0.19.0",
    "scikit-learn>=1.0.0",
    "nibabel>=3.2.0",
    "gymnasium>=0.28.0",
    "stable-baselines3>=2.0.0",
    "tqdm>=4.62.0",
    "pandas>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "domain_adaptation*", "rl_experiments*", "cyclegan*"]
